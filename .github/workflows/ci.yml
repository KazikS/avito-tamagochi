name: CI
on:
  pull_request:
  push: { branches: [main] }

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: go.sum }
      - run: go build ./...
        working-directory: backend
      # -race обязателен: тест на однократность выдачи награды без него бессмыслен.
      - run: go test ./... -race
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - uses: golangci/golangci-lint-action@v6
        with: { working-directory: backend, args: --config=../.golangci.yaml }
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: backend

  contract-drift:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.25', cache-dependency-path: go.sum }
      # Кто-то правил сгенерированные типы руками или спеку без регенерации — упадёт здесь.
      # Пока make gen — no-op (кодоген ещё не подключён), джоб проходит тривиально.
      - run: make gen && git diff --exit-code

  # frontend и e2e джобы добавляются, когда появится frontend/ — см. docs/DECISIONS.md
  # → «не сделанная работа». Не добавлены заранее, чтобы CI не был красным на пустом месте.
