# Проксирует API/WS на бэкенд-сервис docker-compose (имя сервиса "server",
# см. ../../deployments/docker-compose.yaml) — та же цель, что у dev-прокси
# в vite.config.ts, только для собранного статического бандла.
server {
    listen 80;

    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    location /debug/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
    }

    # WebSocket: без Upgrade/Connection nginx проксирует как обычный HTTP,
    # и рукопожатие сокета отвечает 400 вместо 101.
    location /ws {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        # SPA-фолбэк: клиентских роутов сегодня нет (AppRouter — один экран),
        # но обновление страницы на будущем клиентском пути не должно
        # ловить голый 404 от nginx вместо index.html.
        try_files $uri /index.html;
    }
}
